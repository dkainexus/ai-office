<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DK Global Group · AI Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed sandbox world under a soft sky; floating paper panels — top bar with breadcrumb, right panel (approvals / tasks / team / buildings / backend / log), left drawer for the selected agent or building */
:root{
  --sky-1:#cfe6f2;
  --sky-2:#eef5f1;
  --paper:#fbfcfb;
  --paper-2:#eff2f1;
  --ink:#1c2329;
  --ink-2:#5c6872;
  --line:#dfe4e3;
  --cobalt:#2b55c9;
  --amber:#e39a2d;
  --amber-soft:#fcf1dd;
  --ok:#2f8f5b;
  --bad:#c2453b;
  --f-display:"Unbounded","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky-2);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 70%)}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;will-change:transform}
.tag .nm{font-size:11.5px;font-weight:700;background:var(--paper);color:var(--ink);padding:2px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(20,30,40,.18);display:flex;align-items:center;gap:5px}
.tag .nm i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-2));display:block}
.tag .st{font-size:10.5px;color:var(--ink);background:rgba(251,252,251,.82);padding:1px 6px;border-radius:4px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tag.sel .nm{background:var(--cobalt);color:#fff}
.tag.wait .nm{background:var(--amber)}
.btag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.btag b{font-size:13px;background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(20,30,40,.25)}
.btag span{font-size:11px;color:var(--ink);background:rgba(251,252,251,.85);padding:1px 7px;border-radius:4px;margin-top:3px}
.s-work{--c:var(--cobalt)} .s-meet{--c:#6b4fd8} .s-break{--c:var(--ok)} .s-report{--c:var(--amber)} .s-walk{--c:#8b96a0} .s-collab{--c:#1f8a94} .s-idle{--c:#b9c1c7} .s-ride{--c:#8b96a0}
.chip i{background:var(--c,var(--ink-2))}

.topbar{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em}
.nav{background:var(--paper);border-radius:10px;padding:5px 6px;display:flex;align-items:center;gap:2px;box-shadow:0 2px 8px rgba(20,30,40,.12);font-size:13px}
.nav button{border:0;background:none;font:500 13px var(--f-body);padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--ink-2)}
.nav button:hover{background:var(--paper-2)}
.nav button.cur{color:var(--ink);font-weight:700}
.nav .sep{color:var(--line)}
.nav select{border:0;background:var(--paper-2);border-radius:6px;font:700 13px var(--f-body);padding:4px 6px;color:var(--ink);max-width:180px}
.nav .step{font:600 12px var(--f-mono);color:var(--ink)}
.clock{background:var(--paper);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(20,30,40,.12)}
.clock .t{font-family:var(--f-display);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;min-width:50px}
.clock .d{font-size:12px;color:var(--ink-2)}
.seg{display:flex;background:var(--paper-2);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;font:600 12px var(--f-mono);padding:4px 8px;border-radius:5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.btn{border:0;font:600 13px var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible,.sw:focus-visible,.opt:focus-visible,.nav button:focus-visible,.pills button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.btn.primary{background:var(--cobalt);color:#fff;box-shadow:0 2px 8px rgba(43,85,201,.35)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pend{background:var(--amber);color:var(--ink);font-weight:700}
.pend[data-n="0"]{background:var(--paper);color:var(--ink-2);font-weight:500}

.panel{position:absolute;top:66px;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:360px;background:var(--paper);border-radius:14px;box-shadow:0 8px 30px rgba(20,30,40,.18);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 4px}
.tab{flex:1;border:0;background:none;padding:11px 2px 9px;font:600 12.5px var(--f-body);color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;display:flex;justify-content:center;gap:4px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font:600 10.5px var(--f-mono);background:var(--amber);color:var(--ink);border-radius:999px;padding:0 5px;line-height:16px}
.tab .n[data-n="0"]{display:none}
.pane{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.rule{font-size:12px;line-height:1.6;color:var(--ink-2);background:var(--paper-2);border-radius:8px;padding:10px 12px}
.rule b{color:var(--ink)}
.empty{text-align:center;color:var(--ink-2);font-size:13px;padding:22px 10px;line-height:1.7}
.h{font:700 11px var(--f-body);letter-spacing:.06em;color:var(--ink-2);margin:4px 0 -4px;display:flex;justify-content:space-between;align-items:center}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.card.pending{border-color:var(--amber);background:linear-gradient(var(--amber-soft),var(--paper) 60%)}
.card.concl{border-left:3px solid var(--ok)}
.card .meta{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .meta .who{font-weight:700;color:var(--ink)}
.card h4{margin:0;font-size:14.5px;line-height:1.45;text-wrap:balance}
.card p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.card .rev{font-size:11.5px;color:var(--ink);border-left:2px solid var(--line);padding-left:8px;line-height:1.5}
.card input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:13px var(--f-body);background:var(--paper);color:var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{flex:1;min-width:70px;border:0;border-radius:7px;padding:8px 6px;font:700 13px var(--f-body);cursor:pointer}
.opt.yes{background:var(--ink);color:var(--paper)}
.opt.no{background:transparent;color:var(--bad);border:1px solid #e3c2bf}
.res{font-size:12px;font-weight:700}
.res.yes{color:var(--ok)} .res.no{color:var(--bad)}
details.done summary{cursor:pointer;font-size:12px;color:var(--ink-2);padding:4px 0}
details.done .card{opacity:.85;margin-top:8px}
.bar{height:6px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:4px}
.subs{display:flex;flex-direction:column;gap:4px}
.subs div{display:grid;grid-template-columns:52px 1fr auto;gap:6px;font-size:12px;align-items:center}
.subs .d{font-weight:700;color:var(--ink-2)}
.subs .s{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--paper-2)}
.subs .s.doing{background:#e5ecfb;color:var(--cobalt)} .subs .s.done{background:#e2f2e8;color:var(--ok)}
.pform{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper-2)}
.pform input,.pform textarea,.pform select{border:1px solid var(--line);border-radius:7px;padding:8px 9px;font:13px var(--f-body);background:var(--paper);color:var(--ink)}
.pform textarea{min-height:54px;resize:vertical}
.pform .row{display:flex;gap:8px;align-items:center}
.pform .row select{flex:1}

.lvl{font:600 10.5px var(--f-mono);letter-spacing:.08em;color:var(--ink-2);margin:4px 0 -4px}
.member{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.member:hover{background:var(--paper-2)}
.member.sel{border-color:var(--cobalt);background:#eef2fc}
.av{width:30px;height:30px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:var(--bg)}
.av::before{content:"";position:absolute;left:50%;bottom:-8px;width:26px;height:16px;margin-left:-13px;border-radius:50% 50% 0 0;background:var(--tp)}
.av::after{content:"";position:absolute;left:50%;top:5px;width:14px;height:15px;margin-left:-7px;border-radius:50%;background:var(--sk);box-shadow:0 -3px 0 1px var(--hc)}
.member .info{flex:1;min-width:0}
.member .info b{font-size:13.5px;display:block}
.member .info span{font-size:11.5px;color:var(--ink-2)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper-2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;display:block}
.badge{font:600 10.5px var(--f-body);color:#fff;padding:2px 7px;border-radius:4px;background:var(--bc)}
.depts{display:flex;flex-wrap:wrap;gap:6px}

.bcard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bcard .top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper-2)}
.bcard .top b{font-size:14px}
.bcard .top span{font-size:11.5px;color:var(--ink-2)}
.bcard .top .btn{margin-left:auto}
.flist{display:flex;flex-direction:column}
.flist button{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;border:0;border-top:1px solid var(--line);background:var(--paper);padding:8px 12px;font:13px var(--f-body);text-align:left;cursor:pointer;color:var(--ink)}
.flist button:hover{background:#f4f7fd}
.flist .fn{font:600 12px var(--f-mono);color:var(--ink-2)}
.flist .ft{font-size:11px;color:var(--ink-2)}

.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;align-items:center}
.mrow b{font-size:13px}
.mrow .m2{font-size:11.5px;color:var(--ink-2);grid-column:1/2}
.tg{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line);border:0;cursor:pointer;grid-row:1/3;grid-column:2}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ok)} .tg.on::after{left:18px}
.server{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;background:var(--ink);color:var(--paper)}
.server b{font-size:13px} .server span{font-size:11.5px;color:#aab4bd}
.server .tg{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--paper-2);border-radius:9px;padding:9px 10px}
.kpi span{display:block;font-size:11px;color:var(--ink-2)}
.kpi b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.routes{font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.routes dt{color:var(--ink-2)} .routes dd{margin:0}
.pmlog div{font-size:12px;line-height:1.5;padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:44px 52px 1fr;gap:6px}
.pmlog time{font:11.5px var(--f-mono);color:var(--ink-2)}
.pmlog .k{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;text-align:center;align-self:start}
.k.approve{background:#e2f2e8;color:var(--ok)} .k.downgrade{background:#e5ecfb;color:var(--cobalt)} .k.anomaly{background:var(--amber-soft);color:#9a5d0c} .k.block{background:#f6e1df;color:var(--bad)} .k.decide{background:var(--paper-2);color:var(--ink)}
.vitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.vitem .vt{display:flex;align-items:center;gap:8px}
.vitem .vt b{font-size:13.5px}
.vitem .mask{font:12px var(--f-mono);color:var(--ink-2);letter-spacing:.1em}
.vitem .vt .del{margin-left:auto;border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:12px}
.vitem .meta{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pin{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:13px var(--f-mono);background:var(--paper-2);color:var(--ink)}
.lock{font:600 10.5px var(--f-body);background:var(--amber-soft);color:#9a5d0c;padding:1px 6px;border-radius:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.checks label{display:flex;gap:4px;align-items:center}

.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;line-height:1.55;padding:4px 0;border-bottom:1px dashed var(--line)}
.log time{font:12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.log .hl{color:#9a5d0c;font-weight:700}

.drawer{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:340px;background:var(--paper);border-radius:14px;box-shadow:0 8px 30px rgba(20,30,40,.2);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 100px);overflow-y:auto;box-sizing:border-box}
.drawer .hd{display:flex;align-items:center;gap:10px}
.drawer .hd .av{width:42px;height:42px}
.drawer h3{margin:0;font-size:17px}
.drawer .x{margin-left:auto;border:0;background:var(--paper-2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink-2);flex:none}
.kv{display:grid;grid-template-columns:64px 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0}
.prompt{font-size:12.5px;line-height:1.6;background:var(--paper-2);padding:8px 10px;border-radius:8px}
.sub{font:700 11px var(--f-body);color:var(--ink-2);letter-spacing:.04em}
.mem{display:flex;flex-direction:column;font-size:12px;line-height:1.5}
.mem div{display:grid;grid-template-columns:58px 1fr;gap:6px;border-bottom:1px dashed var(--line);padding:3px 0}
.mem time{font:11px var(--f-mono);color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap}

.modal{position:absolute;inset:0;background:rgba(28,35,41,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--paper);border-radius:16px;width:min(880px,100%);max-height:100%;overflow:hidden;display:grid;grid-template-columns:300px 1fr;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pv{background:radial-gradient(ellipse at 50% 35%,#f3f7f8,#cfdbe1);position:relative;min-height:340px}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv .cap{position:absolute;left:16px;bottom:14px;right:16px;font-size:12px;color:var(--ink-2)}
.pv .cap b{display:block;font-size:18px;color:var(--ink)}
.form{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow-y:auto;max-height:min(86vh,760px)}
.form h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.02em}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;font-weight:700;color:var(--ink-2)}
.fld input[type=text],.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--f-body);background:var(--paper);color:var(--ink)}
.fld textarea{resize:vertical;min-height:58px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font:700 12px var(--f-body);color:var(--ink);border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font:13px var(--f-body);cursor:pointer;color:var(--ink)}
.pills button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-pv{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2) center/contain no-repeat;flex:none}
.logo-pv.empty{background-image:repeating-linear-gradient(45deg,var(--paper-2) 0 6px,var(--paper) 6px 12px)}
.pdots{display:inline-flex;gap:2px;margin-right:6px;vertical-align:middle}.pdots i{width:10px;height:10px;border-radius:50%;display:block}
.styles button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;font:600 12px var(--f-body);color:var(--ink)}
.styles button i{height:34px;border-radius:6px;display:block;background:var(--sw)}
.styles button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.plan{display:flex;flex-direction:column;gap:6px}
.plan div{display:grid;grid-template-columns:34px 112px 1fr 92px;gap:6px;align-items:center}
.plan .n{font:600 12px var(--f-mono);color:var(--ink-2)}
.plan select,.plan input{border:1px solid var(--line);border-radius:7px;padding:6px 7px;font:12.5px var(--f-body);background:var(--paper);color:var(--ink);min-width:0}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1}
.range b{font:600 14px var(--f-mono);min-width:44px}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:4px;flex-wrap:wrap}
.foot .note{margin-right:auto;font-size:11.5px;color:var(--ink-2)}

.login{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#1f2a26,#11161b)}
.lcard{width:min(360px,100%);background:var(--paper);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lbrand{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.lbrand b{font-family:var(--f-display);font-size:18px;letter-spacing:.08em}
.lbrand span{font-size:12.5px;color:var(--ink-2)}
.lcard input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:15px var(--f-body);background:var(--paper);color:var(--ink)}
.lerr{font-size:12.5px;color:var(--bad)}

.out{background:var(--paper);color:var(--ink-2);font-weight:500}
.toast{position:absolute;left:50%;top:66px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}

  .drawer{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:auto;top:150px;max-height:34%}
  .sheet{grid-template-columns:1fr;overflow:auto}
  .pv{min-height:230px;height:230px}
  .form{max-height:none;overflow:visible}
  .two{grid-template-columns:1fr}
  .styles{grid-template-columns:repeat(3,1fr)}
  .plan div{grid-template-columns:30px 1fr 1fr;}
  .plan div select.dp{grid-column:2/4}
  .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.tg::after{transition:none}}

function modelCall(r,why,sub){

}
function charge(r,m,sub,n){
  n=n||1;m.calls+=n;const c=m.cost*n;S.cost[m.host]+=c;S.budget.used+=c;r.a.spend=(r.a.spend||0)+c;r.model=m.name;

function freeRoom(b){const fls=[...floorsOf(b),...allFloors()].filter(F=>F.type==='meeting');for(const F of fls)for(const room of F.spots.rooms)if(room.every(s=>s.occ===null)&&!meeting.some(m=>m.room===room))return room;return null;}
function maybeMeeting(){

/* =================== LOOP =================== */
const tmpV=new THREE.Vector3(),tmpC=new THREE.Vector3(),SUNOFF=new THREE.Vector3(38,70,34);
let last=performance.now(),saveAcc=0,uiAcc=0,watchAcc=0;let camAnim=null;
function attach(r){const F=r.floor&&FL[r.floor];if(F&&F.group&&r.av.g.parent!==F.group)F.group.add(r.av.g);}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const sdt=dt*speed;
  if(speed>0){
    S.clock+=sdt;
    if(S.clock>=18*60){dailyReport();S.clock=9*60;S.day++;S.nextMeet=9*60+ri(20,40);addLog(`第 ${S.day} 天开始`);}
    maybeMeeting();meeting.slice().forEach(M=>{if(S.day*10000+S.clock>=M.endAbs)endMeeting(M);});
    S.tasks.forEach(T=>{if(T.status==='planning'&&S.day*10000+S.clock>=(T.planAbs||0))planTask(T);});
    watchAcc+=sdt;if(watchAcc>3){watchAcc=0;pmWatch();}
  }
  Object.values(live).forEach(r=>updateAgent(r,dt,sdt,now));
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+dt/camAnim.dur);const k=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(camAnim.t>=1)camAnim=null;}
  else if(follow&&live[selId]&&live[selId].riding<=0){live[selId].av.g.getWorldPosition(tmpV);tmpV.y+=0.8;const d=tmpC.subVectors(tmpV,controls.target).multiplyScalar(0.08);controls.target.add(d);camera.position.add(d);}
  clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>200)c.position.x=-200;});
  cars.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>c.userData.lim)c.position.x=-c.userData.lim;if(c.position.x<-c.userData.lim)c.position.x=c.userData.lim;});
  Object.values(bRT).forEach(rt=>rt.roof.traverse(o=>{if(o.userData.spin)o.rotation.z+=dt*0.6;}));
  const pc=pendingCount();deciLamps.forEach(m=>m.emissiveIntensity=pc?1.2+Math.sin(now/280)*0.8:0.2);
  sun.target.position.copy(controls.target);sun.position.copy(controls.target).add(SUNOFF);
  controls.update();renderer.render(scene,camera);updateLabels();
  uiAcc+=dt;if(uiAcc>0.3){uiAcc=0;$('#clockT').textContent=hhmm(S.clock);$('#clockD').textContent=`第 ${S.day} 天`;refreshLive();}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  remoteAcc+=dt;if(remoteAcc>20){remoteAcc=0;saveRemote();}
  if(!$('#modal').hidden)renderPreview(dt,'agent');
  if(!$('#bmodal').hidden)renderPreview(dt,'building');
  requestAnimationFrame(frame);
}
function updateAgent(r,dt,sdt,now){
  const av=r.av;
  if(speed>0){
    if(r.riding>0){r.riding-=sdt;if(r.riding<=0){r.riding=0;const s=r.ride;r.ride=null;r.floor=s.floor;attach(r);r.pos.copy(ELEV);r.path=[...s.approach.map(p=>p.clone()),s.pos.clone()];}}
    else if(r.path.length){
      const tgt=r.path[0];const dx=tgt.x-r.pos.x,dz=tgt.z-r.pos.z,dist=Math.hypot(dx,dz);const step=1.5*sdt;
      if(dist>0.001)r.yawT=Math.atan2(dx,dz);
      if(dist<=step){r.pos.x=tgt.x;r.pos.z=tgt.z;r.path.shift();
        if(!r.path.length){
          if(r.ride){r.riding=FL[r.ride.floor].b===FL[r.floor].b?2.5:7;}
          else{const s=r.target;r.atSpot=s;r.seated=!!s.sit;r.yawT=s.face;if(r.queued){const q=r.queued;r.queued=null;goTo(r,...q);}}
        }}
      else{r.pos.x+=dx/dist*step;r.pos.z+=dz/dist*step;}
      r.phase+=sdt*9;
    }else{
      if(r.act!=='meet'&&r.act!=='idle'){r.timer-=sdt;
        if(r.timer<=0){if(r.act==='report'){release(r);r.bubble={txt:'先回去忙，等你回复',until:now+2500};r.act='idle';startWork(r,'等待 Dave 审批');}else endActivity(r);}}
      if(r.act==='idle')nextActivity(r);
    }
  }
  const visible=!!r.floor&&r.riding<=0;
  av.g.visible=visible;if(!visible)return;
  if(!av.g.parent||!av.g.parent.visible)return;
  let d=r.yawT-r.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));r.yaw+=d*Math.min(1,dt*10);
  av.g.position.set(r.pos.x,0,r.pos.z);av.g.rotation.y=r.yaw;
  const walking=r.path.length>0&&speed>0,t=now/1000;
  const [L,R]=av.legs,[AL,AR]=av.arms;
  if(walking){const s=Math.sin(r.phase);L.up.rotation.x=s*0.55;R.up.rotation.x=-s*0.55;L.kn.rotation.x=Math.max(0,-s)*0.6;R.kn.rotation.x=Math.max(0,s)*0.6;
    AL.sh.rotation.x=-s*0.45;AR.sh.rotation.x=s*0.45;AL.el.rotation.x=AR.el.rotation.x=-0.25;av.hip.position.y=0.86+Math.abs(Math.cos(r.phase))*0.025;av.head.rotation.x=0;av.head.rotation.y=0;}
  else if(r.seated){
    av.hip.position.y=0.5;L.up.rotation.x=R.up.rotation.x=-Math.PI/2;L.kn.rotation.x=R.kn.rotation.x=Math.PI/2;
    if(r.act==='work'){AL.sh.rotation.x=-0.55+Math.sin(t*14+r.phase)*0.04;AR.sh.rotation.x=-0.55+Math.cos(t*13+r.phase)*0.04;AL.el.rotation.x=AR.el.rotation.x=-0.85;av.head.rotation.x=0.1;av.head.rotation.y=Math.sin(t*0.4+r.phase)*0.15;}
    else if(r.act==='meet'){const talk=Math.sin(t*1.2+r.phase*3)>0.5;AL.sh.rotation.x=-0.3;AL.el.rotation.x=-0.9;AR.sh.rotation.x=talk?-0.7+Math.sin(t*5)*0.25:-0.3;AR.el.rotation.x=talk?-1.2:-0.9;av.head.rotation.x=Math.sin(t*2+r.phase)*0.06;av.head.rotation.y=Math.sin(t*0.7+r.phase)*0.35;av.mouth.scale.y=talk?0.6+Math.abs(Math.sin(t*12))*0.8:1;}
    else{AL.sh.rotation.x=AR.sh.rotation.x=-0.25;AL.el.rotation.x=AR.el.rotation.x=-0.6;av.head.rotation.x=-0.05;av.head.rotation.y=Math.sin(t*0.5+r.phase)*0.3;}
  }else{
    av.hip.position.y=0.86;L.up.rotation.x=R.up.rotation.x=0;L.kn.rotation.x=R.kn.rotation.x=0;av.head.rotation.x=0;
    if(r.atSpot&&r.atSpot.bar){AR.sh.rotation.x=-0.5;AR.el.rotation.x=-1.4;AL.sh.rotation.x=0;AL.el.rotation.x=-0.1;}
    else if(r.act==='collab'||r.act==='break'){const talk=Math.sin(t*1.4+r.phase*2)>0.3;AR.sh.rotation.x=talk?-0.5:-0.05;AR.el.rotation.x=talk?-1.1:-0.15;AL.sh.rotation.x=-0.05;AL.el.rotation.x=-0.15;av.mouth.scale.y=talk?0.6+Math.abs(Math.sin(t*11))*0.8:1;av.head.rotation.y=Math.sin(t*0.6+r.phase)*0.25;}
    else{AL.sh.rotation.x=AR.sh.rotation.x=Math.sin(t*1.5+r.phase)*0.03;AL.el.rotation.x=AR.el.rotation.x=-0.12;av.head.rotation.y=Math.sin(t*0.5+r.phase)*0.2;}
  }
  if(!(r.act==='meet'||r.act==='collab'||r.act==='break')||walking)av.mouth.scale.y=1;
  av.blink-=dt;const bl=av.blink<0.12&&av.blink>0;av.eyes.forEach(e=>e.scale.y=bl?0.12:1);if(av.blink<0)av.blink=2+Math.random()*4;

}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const rc=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(ndc,camera);
  const targets=[...Object.values(bRT).map(rt=>rt.root)];
  const hits=ray.intersectObjects(targets,true);
  for(const h of hits){const o=h.object;if(o.userData.noPick||!shown(o))continue;
    if(o.userData.agentId){selectAgent(o.userData.agentId);return;}
